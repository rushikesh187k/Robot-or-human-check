<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human or Robot?</title>
    <style>
        /* Modern, Professional Dark Theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #eaeaea;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Navigation Tabs */
        .tabs {
            background-color: #151515;
            padding: 15px;
            border-bottom: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .tab-btn {
            background-color: transparent;
            color: #888;
            border: 2px solid transparent;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { 
            color: #00e5ff; 
            border-bottom: 2px solid #00e5ff; 
        }

        /* Container & Content */
        .container {
            padding: 40px 30px;
            max-width: 600px;
            margin: 40px auto;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #ffffff; font-weight: 300; letter-spacing: 1px; }
        p { color: #aaaaaa; }

        /* Day Buttons */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .days-grid button {
            background-color: #222;
            color: #ccc;
            border: 1px solid #444;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .days-grid button:hover { 
            background-color: #00e5ff; 
            color: #000;
            border-color: #00e5ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.3);
        }

        /* Loading Screen */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            color: #00e5ff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 28px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }

        /* Result Screen */
        #result-box {
            display: none;
            background: #111;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-top: 20px;
        }
        .robot { color: #ff3366; font-weight: bold; font-size: 20px; }
        .human { color: #00e5ff; font-weight: bold; font-size: 20px; }
        .dare {
            background-color: rgba(255, 51, 102, 0.1);
            border-left: 4px solid #ff3366;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
            font-weight: bold;
            color: #ff99bb;
            font-size: 18px;
            text-align: left;
        }
        .try-again {
            margin-top: 25px;
            background-color: transparent;
            border: 2px solid #00e5ff;
            padding: 10px 20px;
            color: #00e5ff;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .try-again:hover {
            background-color: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">System Check</button>
        <button class="tab-btn" onclick="switchTab('tab2')">Intelligence Test</button>
    </div>

    <div id="tab1" class="container tab-content active">
        <h1>Entity Verification 🤖</h1>
        <p>Confirm your biological status. Select today's current day.</p>
        
        <div id="days-container" class="days-grid">
            <button onclick="checkDay('Sunday')">Sunday</button>
            <button onclick="checkDay('Monday')">Monday</button>
            <button onclick="checkDay('Tuesday')">Tuesday</button>
            <button onclick="checkDay('Wednesday')">Wednesday</button>
            <button onclick="checkDay('Thursday')">Thursday</button>
            <button onclick="checkDay('Friday')">Friday</button>
            <button onclick="checkDay('Saturday')">Saturday</button>
        </div>

        <div id="result-box">
            <h2 id="result-title"></h2>
            <p id="result-desc"></p>
            <button class="try-again" onclick="resetGame()">Reboot System</button>
        </div>
    </div>

    <div id="tab2" class="container tab-content">
        <h1>Are you smart or not? 🧠</h1>
        <p>Awaiting database update. Provide the questions to initiate.</p>
    </div>

    <div id="loading-screen">
        <h2 id="loading-text">Initializing...</h2>
    </div>

    <script>
        // List of 10 crush-related school dares
        const dares = [
            "Walk past your crush's classroom/desk and wave at them casually. 👋",
            "Ask your crush to borrow a pen or pencil today, even if you don't need one. ✏️",
            "Look directly at your crush and smile for 3 seconds straight. 😊",
            "Write your crush's initials on your hand and leave it there until school ends. ✍️",
            "Find an excuse to compliment your crush's outfit or hair today. ✨",
            "Send your crush a completely random, out-of-context emoji right now. 📱",
            "Drop something 'accidentally' near your crush and wait to see if they pick it up. 🎒",
            "Stand near your crush and talk slightly louder to your friends so they notice you. 🗣️",
            "Tell your best friend a secret about your crush out loud. 🤫",
            "Make eye contact with your crush from across the room and don't look away first. 👀"
        ];

        // Funny Loading Phrases
        const loadingPhrases = [
            "Bypassing security...",
            "Asking Newton...",
            "Solving rocket science...",
            "Asking Rushikesh...",
            "Hacking NASA...",
            "Asking Modi...",
            "Stopping America and Iran war...",
            "Decrypting results..."
        ];

        // Switch between the two tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Helper function to create pauses
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Main game logic
        async function checkDay(guessedDay) {
            document.getElementById('days-container').style.display = 'none';
            document.getElementById('result-box').style.display = 'none';
            
            const loadingScreen = document.getElementById('loading-screen');
            const loadingText = document.getElementById('loading-text');
            loadingScreen.style.display = 'flex';

            for (let i = 0; i < loadingPhrases.length; i++) {
                loadingText.innerText = loadingPhrases[i];
                await sleep(1200);
            }

            loadingScreen.style.display = 'none';

            const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayDate = new Date();
            const actualDay = daysOfWeek[todayDate.getDay()];

            const resultBox = document.getElementById('result-box');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');

            resultBox.style.display = 'block';

            if (guessedDay === actualDay) {
                resultTitle.innerHTML = `<span class="human">ACCESS GRANTED: HUMAN DETECTED</span>`;
                resultDesc.innerText = `Sensors confirm today is ${actualDay}. Your biological brain is functioning within normal parameters.`;
            } else {
                const randomDare = dares[Math.floor(Math.random() * dares.length)];
                resultTitle.innerHTML = `<span class="robot">ALERT: ROBOT IMPOSTER DETECTED!</span>`;
                resultDesc.innerHTML = `You selected ${guessedDay}, but the database confirms today is <b>${actualDay}</b>! <br><br> 
                                        Punishment protocol initiated. You must complete the following objective:
                                        <div class="dare">CRUSH DARE: <br><br>${randomDare}</div>`;
            }
        }

        function resetGame() {
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('days-container').style.display = 'grid';
        }
    </script>

</body>
</html>
